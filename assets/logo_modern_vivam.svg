<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border -->
  <rect width="496" height="496" x="2" y="2" rx="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Glowing Outer Ambient Ring -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- Soundwaves Orbit -->
  <!-- Wave Left 2 -->
  <path d="M 160 160 A 85 85 0 0 0 160 280" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.75" />
  <!-- Wave Left 1 -->
  <path d="M 190 180 A 55 55 0 0 0 190 260" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Wave Right 1 -->
  <path d="M 310 180 A 55 55 0 0 1 310 260" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />
  <!-- Wave Right 2 -->
  <path d="M 340 160 A 85 85 0 0 1 340 280" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.75" />

  <!-- Center Core Signal Glow -->
  <circle cx="250" cy="220" r="38" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="220" r="34" fill="url(#primaryGrad)"/>

  <!-- Center Inner Symbol: Radiating Flame & Cross Motif -->
  <path d="M 250 194 Q 257 210 262 218 Q 268 226 264 234 Q 259 242 250 244 Q 241 242 236 234 Q 232 226 238 218 Q 243 210 250 194 Z" fill="#ffffff" />
  
  <!-- Broadcast Signal Beam -->
  <polygon points="250,140 258,185 242,185" fill="url(#goldGrad)" opacity="0.85"/>
  <circle cx="250" cy="135" r="7" fill="#ffffff" filter="url(#glow)"/>

  <!-- Modern Typography -->
  <text x="250" y="390" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="48" letter-spacing="4" fill="#ffffff">
    RÁDIO <tspan fill="url(#primaryGrad)">VIVAM</tspan>
  </text>
  
  <text x="250" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="#94a3b8">
    VIDAS EM AVIVAMENTO
  </text>
</svg>
